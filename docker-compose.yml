version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: travelforge_postgres
    restart: always
    environment:
      POSTGRES_USER: travelforge
      POSTGRES_PASSWORD: travelforge
      POSTGRES_DB: travelforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelforge -d travelforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: travelforge_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
